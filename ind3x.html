<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>semdel — Markdown</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#fcf8ff;color:#292735;font:16px/1.5 system-ui,sans-serif}
main{max-width:900px;margin:auto;padding:12px;min-width:0}
nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
button,.action{font:inherit;font-size:14px;line-height:1.3;padding:9px 12px;border:0;border-radius:5px;background:#67509b;color:white;cursor:pointer;text-decoration:none;max-width:100%;white-space:normal}
button:hover,.action:hover{background:#523c81}button:disabled{opacity:.55;cursor:wait}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid #ad6500;outline-offset:2px}
#status{font-size:14px;overflow-wrap:anywhere;margin:6px 0}#status:empty{display:none}#status.error{color:#96202b}
#editor{height:65vh;height:65dvh;min-height:180px;border:1px solid #625d73;border-radius:4px;overflow:hidden;background:#282a36}
#source,.CodeMirror{width:100%;height:100%;font:16px/1.5 ui-monospace,Consolas,monospace}
#source{display:block;resize:none;border:0;padding:12px;background:#282a36;color:#f8f8f2;tab-size:4}
.cm-s-dracula .cm-header{color:#ff79c6}.cm-s-dracula .cm-strong{color:#f1fa8c}.cm-s-dracula .cm-em{color:#50fa7b}
[hidden]{display:none!important}::selection{background:#67509b;color:white}
@media(max-width:400px){main{padding:6px}nav{gap:4px}button,.action{padding:7px 8px}}
</style>
</head>
<body>
<main>
<nav aria-label="Actions du document">
<button id="edit">Ouvrir dans l’éditeur Markdown</button>
<button id="download">Télécharger .md</button>
<button id="copy">Copier</button>
<a class="action" id="open" target="_blank" rel="noopener noreferrer">Pleine page</a>
<button id="retry" hidden>Réessayer le chargement</button>
</nav>
<p id="status" role="status" aria-live="polite"></p>
<div id="editor"><textarea id="source" aria-label="Contenu Markdown" spellcheck="false"></textarea></div>
<noscript>Activez JavaScript pour charger le fichier Markdown.</noscript>
</main>
<script>
'use strict';
// Formats : ?file=astratobloom.md, ?url=URL_ENCODEE,
// #!url:https://… et #!gist:utilisateur/identifiant (compatibilité).
const $ = id => document.getElementById(id);
const source = $('source');
let cm = null, stack = null, currentLoad = null, revision = 0;
let filename = 'document.md';
const getText = () => cm ? cm.getValue() : source.value;
function setText(text) { if(cm) cm.setValue(text); else source.value = text; }
function status(text, error = false) { $('status').textContent = text; $('status').classList.toggle('error', error); }
function busy(value) {
  source.readOnly = value;
  if(cm) cm.setOption('readOnly', value);
  for(const id of ['edit','download','copy']) $(id).disabled = value;
  $('editor').setAttribute('aria-busy', String(value));
}
function decode(value) {
  try { return decodeURIComponent(value); }
  catch { throw new Error('Encodage de l’adresse invalide. Corrigez le lien de l’iframe.'); }
}
function validateURL(value, base) {
  // Ne jamais transformer du HTML injecté par un forum en URL relative.
  if(!value || /[<>"\u0000-\u001f]/.test(value) || /%3c|%3e|%22/i.test(value))
    throw new Error('Adresse absente ou altérée par le forum. Utilisez ?file=nom.md ou une URL encodée.');
  let url;
  try { url = new URL(value, base); } catch { throw new Error('Adresse du fichier invalide.'); }
  if(!['http:', 'https:'].includes(url.protocol) || url.username || url.password)
    throw new Error('Seules les adresses HTTP(S) sans identifiants sont acceptées.');
  return url.href;
}
function parseSource(href) {
  const page = new URL(href), params = page.searchParams;
  let value, kind;
  if(params.has('file')) { value = params.get('file'); kind = 'file'; }
  else if(params.has('url')) { value = params.get('url'); kind = 'url'; }
  else if(params.has('gist')) { value = params.get('gist'); kind = 'gist'; }
  else if(page.hash.startsWith('#!url:')) {
    value = page.hash.slice(6);
    // Décoder une URL entièrement encodée, sans casser les %26/%23 internes.
    if(/^https?%3a/i.test(value)) value = decode(value);
    kind = 'url';
  } else if(page.hash.startsWith('#!gist:')) { value = decode(page.hash.slice(7)); kind = 'gist'; }
  else if(page.hash) throw new Error('Format du lien inconnu. Utilisez ?file=nom.md.');
  else return null;
  if(kind === 'gist') {
    const match = /^(?:[\w-]+\/)?([a-f\d]+)$/i.exec(value);
    if(!match) throw new Error('Identifiant Gist invalide.');
    return {kind, url:'https://api.github.com/gists/' + match[1]};
  }
  return {kind:'url', url:validateURL(value, kind === 'file' ? new URL('.',page).href : undefined)};
}
async function request(url, signal, json = false) {
  const response = await fetch(url, {signal, credentials:'omit'});
  if(!response.ok) throw new Error(`HTTP ${response.status} — ${url}`);
  return json ? response.json() : response.text();
}
async function load() {
  const version = ++revision;
  if(currentLoad) currentLoad.abort();
  currentLoad = new AbortController();
  const controller = currentLoad;
  let timeout;
  $('open').href = location.href;
  $('retry').hidden = true;
  try {
    const target = parseSource(location.href);
    if(!target) { busy(false); status('Saisissez du Markdown, ou ajoutez ?file=nom.md à l’adresse.'); return; }
    busy(true); status('Chargement du document…');
    timeout = setTimeout(() => controller.abort(), 20000);
    let text;
    if(target.kind === 'gist') {
      const data = await request(target.url, controller.signal, true);
      const files = Object.values(data.files || {});
      const file = files.find(f => /\.md$/i.test(f.filename)) || files[0];
      if(!file) throw new Error('Ce Gist ne contient aucun fichier.');
      text = file.truncated ? await request(validateURL(file.raw_url), controller.signal) : file.content;
      if(typeof text !== 'string') throw new Error('Contenu du Gist indisponible.');
      if(version === revision) filename = file.filename;
    } else {
      text = await request(target.url, controller.signal);
      if(version === revision) filename = new URL(target.url).pathname.split('/').pop() || 'document.md';
    }
    if(version !== revision) return;
    setText(text); status(text ? '' : 'Le fichier est vide.'); refresh();
  } catch(error) {
    if(version !== revision) return;
    const message = error.name === 'AbortError' ? 'Le chargement a dépassé 20 secondes.' :
      error instanceof TypeError ? 'Accès réseau impossible : vérifiez la connexion, les autorisations CORS ou les restrictions du forum.' : error.message;
    status(message + ' Le texte déjà présent est conservé.', true);
    $('retry').hidden = false;
  } finally {
    clearTimeout(timeout);
    if(version === revision) busy(false);
  }
}
const scripts = new Map();
function script(url) {
  if(scripts.has(url)) return scripts.get(url);
  const promise = new Promise((resolve,reject) => {
    const node = document.createElement('script'); node.src = url;
    node.onload = resolve; node.onerror = () => { node.remove(); scripts.delete(url); reject(new Error('Bibliothèque indisponible.')); };
    document.head.append(node);
  });
  scripts.set(url,promise); return promise;
}
function stylesheet(url) {
  return new Promise((resolve,reject) => {
    const node = document.createElement('link'); node.rel = 'stylesheet'; node.href = url;
    node.onload = resolve; node.onerror = reject; document.head.append(node);
  });
}
let refreshFrame;
function refresh() {
  cancelAnimationFrame(refreshFrame);
  refreshFrame = requestAnimationFrame(() => { if(cm) cm.refresh(); });
}
async function enhance() {
  const base = 'https://cdn.jsdelivr.net/npm/codemirror@5.65.9/';
  try {
    await Promise.all([stylesheet(base+'lib/codemirror.min.css'),stylesheet(base+'theme/dracula.min.css'),script(base+'lib/codemirror.min.js')]);
    for(const path of ['mode/xml/xml.js','addon/mode/overlay.js','mode/markdown/markdown.js','mode/gfm/gfm.js']) await script(base+path);
    cm = CodeMirror.fromTextArea(source, {mode:'gfm',theme:'dracula',lineNumbers:true,lineWrapping:true,viewportMargin:10,readOnly:source.readOnly});
    cm.setSize('100%','100%'); refresh();
  } catch { /* Le textarea reste utilisable si le CDN est bloqué. */ }
}
$('retry').onclick = load;
window.addEventListener('hashchange', load);
window.addEventListener('resize', refresh);
window.addEventListener('pageshow', refresh);
document.addEventListener('visibilitychange', () => { if(!document.hidden) refresh(); });
if('ResizeObserver' in window) new ResizeObserver(refresh).observe($('editor'));
if('IntersectionObserver' in window) new IntersectionObserver(entries => {if(entries.some(e=>e.isIntersecting)) refresh();}).observe($('editor'));
$('copy').onclick = async () => {
  try { await navigator.clipboard.writeText(getText()); status('Texte copié.'); }
  catch {
    const temp = document.createElement('textarea'); temp.value = getText();
    temp.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0'; document.body.append(temp); temp.select();
    let copied = false;
    try { copied = document.execCommand('copy'); } catch {} finally { temp.remove(); }
    if(copied) status('Texte copié.');
    else { if(cm) {cm.focus();cm.execCommand('selectAll');} else {source.focus();source.select();} status('Copie bloquée par le navigateur : texte sélectionné, utilisez Ctrl+C ou Cmd+C.', true); }
  }
};
$('download').onclick = () => {
  const url = URL.createObjectURL(new Blob([getText()], {type:'text/markdown;charset=utf-8'}));
  const link = document.createElement('a'); link.href = url; link.download = filename.replace(/[\\/:*?"<>|]/g,'_');
  document.body.append(link); link.click(); link.remove(); setTimeout(()=>URL.revokeObjectURL(url),10000);
};
$('edit').onclick = async () => {
  $('edit').disabled = true; status('Ouverture de l’éditeur…');
  try {
    await script('https://unpkg.com/stackedit-js@1.0.7/docs/lib/stackedit.min.js');
    if(!stack) {stack = new Stackedit(); stack.on('fileChange', file => setText(file.content.text || ''));}
    stack.openFile({name:filename,content:{text:getText()}}); status('');
  } catch {status('Éditeur externe indisponible. Vous pouvez modifier le texte ici ou ouvrir la pleine page.', true);}
  finally {$('edit').disabled = false;}
};
load();
enhance();
</script>
</body>
</html>
